timezone: America/Detroit

domain: mclaysen.com
email_address: me@mclaysen.com
username: ansible
node_exporter_version: 1.10.2
cadvisor_listen_ip: 172.17.0.1
cadvisor_port: 8080
cadvisor_version: 0.55.1
container_manager_host_ip: 192.168.86.202

# System configuration
fileshare_group_name: fileshare_users
fileshare_group_gid: 3004
home_videos_nfs_share: 192.168.86.200:/mnt/philbert/media/home_videos
home_videos_mount_point: /mnt/truenas_shares/home
movies_nfs_share: 192.168.86.200:/mnt/philbert/media/movies
movies_mount_point: /mnt/truenas_shares/movies

# Pangolin installer configuration
reverse_proxy_ip: 192.168.86.168

unifi_url: https://192.168.86.1

docker_metrics_addr: 0.0.0.0:9323
container_manager_nvidia_enabled: false
# Routine OS updates intentionally exclude the kernel, DKMS, CUDA, and NVIDIA
# packages. Set this to true only for a planned NVIDIA maintenance run.
container_manager_nvidia_update: false
container_manager_nvidia_cuda_repo_baseurl: https://developer.download.nvidia.com/compute/cuda/repos/rhel10/x86_64/
container_manager_nvidia_container_repo_baseurl: https://nvidia.github.io/libnvidia-container/stable/rpm/$basearch
container_manager_nvidia_repo_packages:
  - epel-release
container_manager_nvidia_prerequisite_packages:
  - dkms
  - kernel-devel
  - kernel-headers
  - gcc
  - make
container_manager_nvidia_kernel_packages:
  - kernel*
container_manager_nvidia_driver_branch: "580"
container_manager_nvidia_driver_packages:
  - "cuda-drivers-{{ container_manager_nvidia_driver_branch }}"
container_manager_nvidia_container_packages:
  - nvidia-container-toolkit

# Portainer configuration
portainer_image: portainer/portainer-ce
portainer_tag: 2.41.1
portainer_container_name: portainer
portainer_data_dir: /opt/portainer/data
portainer_https_port: 9443
portainer_agent_port: 9001
portainer_http_port: 9000
endpoint_id: 3
portainer_manager_endpoint: http://{{ container_manager_host_ip }}:9000 #https://container-manager.mclaysen.com

#Cloudflared configuration
cloudflared_version: 2026.8.1

# Newt configuration
newt_version: 1.16.0
blueprint_file_path: /home/{{ username }}/docker/newt/config/home1_pangolin_blueprint.yml

#Jellyfin
jellyfin_version: 10.11.8

#smarthome stack
homebridge_version: '2026-06-24'
homebridge_config_dir: /home/{{ username }}/docker/smarthome/homebridge

#monitoring stack
prometheus_version: v3.9.1
prometheus_host_port: 9091
prometheus_config_path: /home/{{ username }}/docker/monitoring/prometheus/prometheus.yml
grafana_provisioning_path: /home/{{ username }}/docker/monitoring/grafana/provisioning
grafana_dashboards_path: /home/{{ username }}/docker/monitoring/grafana/dashboards
grafana_url: http://192.168.86.202:3001
alloy_version: v1.14.1
loki_version: 3.6.7
alloy_config_dir: /home/{{ username }}/docker/monitoring/alloy
loki_config_path: /home/{{ username }}/docker/monitoring/loki/loki-config.yml
loki_host_port: 3100
nginx_prometheus_exporter_target: 192.168.86.168:9113

#immich
immich_version: v3.1.0
immich_upload_location: /home/{{ username }}/docker/immich/upload
immich_db_data_location: /home/{{ username }}/docker/immich/db
immich_external_photos_nfs_share: 192.168.86.200:/mnt/philbert/media/photos
immich_external_photos_mount_point: /mnt/truenas_shares/photos
immich_external_photos_container_path: /mnt/media/photos
immich_backup_nfs_share: 192.168.86.200:/mnt/philbert/application_backup/immich
immich_backup_mount_point: /mnt/truenas_shares/immich_backups
immich_restic_password_file: /etc/restic/immich_password
immich_restic_path: "{{ immich_backup_mount_point }}/restic-repo"
immich_backup_script_path: /usr/local/bin/immich-backup.sh

#ghost
ghost_upload_path: /home/{{ username }}/docker/ghost/content
ghost_mysql_data_path: /home/{{ username }}/docker/ghost/mysql
ghost_admin_domain: ghost.mclaysen.com
ghost_domain: blog.mclaysen.com
ghost_email_from: "notifications@{{ domain }}"

#dawarich
dawarich_app_port: 3003
dawarich_application_hosts: localhost,::1,127.0.0.1,maps.mclaysen.com,192.168.86.202,dawarich_app:3000
dawarich_prometheus_exporter_enabled: true
dawarich_metrics_username: prometheus
dawarich_domain: maps.{{ domain }}
dawarich_smtp_starttls: "false"
dawarich_smtp_authentication: plain
dawarich_backup_nfs_share: 192.168.86.200:/mnt/philbert/application_backup/dawarich
dawarich_backup_mount_point: /mnt/truenas_shares/dawarich_backups
dawarich_restic_password_file: /etc/restic/dawarich_password
dawarich_restic_path: "{{ dawarich_backup_mount_point }}/restic-repo"
dawarich_backup_script_path: /usr/local/bin/dawarich-backup.sh

#email settings
email_domain: protonmail-bridge
email_port: 25

sudoers_file_path: /etc/sudoers

security_ssh_config_path: /etc/ssh/sshd_config
security_sshd_name: sshd

security_ssh_port: 22
security_ssh_password_authentication: "no"
security_ssh_permit_root_login: "no"
security_ssh_usedns: "no"
security_ssh_permit_empty_password: "no"
security_ssh_challenge_response_auth: "no"
security_ssh_gss_api_authentication: "no"
security_ssh_x11_forwarding: "no"
security_sshd_state: started
security_ssh_restart_handler_state: restarted
security_ssh_allowed_users: 
  - "{{ username }}"
security_ssh_allowed_groups: []

security_sudoers_passwordless:
  - "{{ username }}"
security_sudoers_passworded: []

security_autoupdate_enabled: true
security_autoupdate_blacklist: []
security_autoupdate_additional_origins: []