---
- name: Prepare Stack Configurations
  hosts: container_manager
  become: true
  handlers:
    - ansible.builtin.import_tasks: ../handlers/main.yml
  vars_files:
    - ../../group_vars/portainer_managers/vars.yml
  tasks:
    - name: Create monitoring config directory
      ansible.builtin.file:
        path: "{{ prometheus_config_path | ansible.builtin.dirname }}"
        state: directory
        mode: '0755'
        recurse: true

    - name: Create logging config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ username }}"
        group: "{{ username }}"
      loop:
        - "{{ alloy_config_dir }}"
        - "{{ loki_config_path | ansible.builtin.dirname }}"

    - name: Create smarthome config directory
      ansible.builtin.file:
        path: "{{ homebridge_config_dir }}"
        state: directory
        mode: '0755'
        recurse: true

    - name: Create directories for ghost content and MySQL data
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ghost_upload_path }}"
        - "{{ ghost_mysql_data_path }}"

    - name: Create immich upload directory and db_data directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ immich_upload_location }}"
        - "{{ immich_db_data_location }}"

    - name: Place Prometheus configuration
      ansible.builtin.template:
        src: ../stacks/prometheus_config.yml.j2
        dest: "{{ prometheus_config_path }}"
        mode: '0644'

    - name: Place Alloy configuration
      ansible.builtin.template:
        src: ../templates/alloy_config.alloy.j2
        dest: "{{ alloy_config_dir }}/config.alloy"
        mode: '0644'
        owner: "{{ username }}"
        group: "{{ username }}"

    - name: Place Loki configuration
      ansible.builtin.template:
        src: ../templates/loki_config.yml.j2
        dest: "{{ loki_config_path }}"
        mode: '0644'
        owner: "{{ username }}"
        group: "{{ username }}"

    - name: Deploy docker config
      ansible.builtin.template:
        src: ../../shared/templates/docker_daemon.json.j2
        dest: /etc/docker/daemon.json
      notify: restart docker

    - name: Deploy monitoring apps
      ansible.builtin.import_tasks: ../tasks/apps.yml

- name: Manage Portainer stacks
  hosts: portainer_managers
  gather_facts: false
  collections:
    - bgtor.portainer
  vars_files:
    - ../../group_vars/portainer_managers/vault.yml
    - ../../group_vars/portainer_managers/vars.yml
  vars:
    portainer_url: "{{ portainer_manager_endpoint }}"
    portainer_token: "{{ portainer_api_token }}"
    rendered_dir: /tmp/portainer-stacks
    stacks:
      - name: smarthome
        template: ../stacks/smarthome.yml.j2
        stack_type: standalone
        endpoint_id: "{{ endpoint_id }}"
        env: []
        prune: true
        pull_images: true
      - name: monitoring_stack
        template: ../stacks/monitoring_stack.yml.j2
        stack_type: standalone
        endpoint_id: "{{ endpoint_id }}"
        env: []
        prune: true
        pull_images: true
      - name: jellyfin
        template: ../stacks/jellyfin.yml.j2
        stack_type: standalone
        endpoint_id: "{{ endpoint_id }}"
        env: []
        prune: true
        pull_images: true
      - name: jellystat
        template: ../stacks/jellystat.yml.j2
        stack_type: standalone
        endpoint_id: "{{ endpoint_id }}"
        env: []
        prune: true
        pull_images: true
      - name: newt
        template: ../stacks/newt.yml.j2
        stack_type: standalone
        endpoint_id: "{{ endpoint_id }}"
        env: []
        prune: true
        pull_images: true
      - name: cloudflared
        template: ../stacks/cloudflared.yml.j2
        stack_type: standalone
        endpoint_id: "{{ endpoint_id }}"
        env: []
        prune: true
        pull_images: true
      - name: mclaysen_website
        template: ../stacks/mclaysen_website.yml.j2
        stack_type: standalone
        endpoint_id: "{{ endpoint_id }}"
        env: []
        prune: true
        pull_images: true
      - name: immich
        template: ../stacks/immich.yml.j2
        stack_type: standalone
        endpoint_id: "{{ endpoint_id }}"
        env:
          - name: UPLOAD_LOCATION
            value: "{{ immich_upload_location }}"
          - name: DB_DATA_LOCATION
            value: "{{ immich_db_data_location }}"
          - name: DB_PASSWORD
            value: "{{ immich_db_password }}"
          - name: DB_USERNAME
            value: postgres
          - name: DB_DATABASE_NAME
            value: immich
        prune: true
        pull_images: true
      - name: ghost
        template: ../stacks/ghost.yml.j2
        stack_type: standalone
        endpoint_id: "{{ endpoint_id }}"
        env:
          - name: DOMAIN
            value: "{{ ghost_domain }}"
          - name: ADMIN_DOMAIN
            value: "{{ ghost_admin_domain }}"
          - name: DATABASE_ROOT_PASSWORD
            value: "{{ ghost_database_root_password }}"
          - name: DATABASE_USER
            value: "{{ ghost_database_user }}"
          - name: DATABASE_PASSWORD
            value: "{{ ghost_database_password }}"
          - name: mail__transport
            value: SMTP
          - name: mail__options__host
            value: protonmail-bridge
          - name: mail__options__port
            value: "25"
          - name: mail__options__secure
            value: "false"
          - name: mail__options__auth__user
            value: "{{ ghost_email_user }}"
          - name: mail__options__auth__pass
            value: "{{ ghost_email_password }}"
          - name: mail__from
            value: "{{ ghost_email_from }}"
          - name: UPLOAD_LOCATION
            value: "{{ ghost_upload_path }}"
          - name: MYSQL_DATA_LOCATION
            value: "{{ ghost_mysql_data_path }}"
        prune: true
        pull_images: true
      - name: protonmail_bridge
        template: ../stacks/proton_mail_bridge.yml.j2
        stack_type: standalone
        endpoint_id: "{{ endpoint_id }}"
        env:
          - name: PROTONMAIL_KEYRING_PASSPHRASE
            value: "{{ PROTONMAIL_KEYRING_PASSPHRASE }}"
        prune: true
        pull_images: true
  tasks:
    - name: Ensure API token is provided
      ansible.builtin.assert:
        that: portainer_token != ""
        fail_msg: PORTAINER_API_TOKEN environment variable must be set

    - name: Ensure rendered compose directory exists
      ansible.builtin.file:
        path: "{{ rendered_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Render compose templates for stacks
      ansible.builtin.template:
        src: "{{ item.template }}"
        dest: "{{ rendered_dir }}/{{ item.name }}.yml"
      loop: "{{ stacks | selectattr('template', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Create network for Pangolin
      bgtor.portainer.portainer_network:
        portainer_url: "{{ portainer_url }}"
        portainer_token: "{{ portainer_token }}"
        name: pangolin_network
        driver: bridge
        endpoint_id: "{{ endpoint_id }}"
        state: present
        internal: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Create network for Protonmail
      bgtor.portainer.portainer_network:
        portainer_url: "{{ portainer_url }}"
        portainer_token: "{{ portainer_token }}"
        name: protonmail-network
        driver: bridge
        endpoint_id: "{{ endpoint_id }}"
        state: present
        internal: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Deploy or update Portainer stacks from compose files
      bgtor.portainer.portainer_stack:
        portainer_url: "{{ portainer_url }}"
        portainer_token: "{{ portainer_token }}"
        name: "{{ item.name }}"
        stack_type: "{{ item.stack_type | default('standalone') }}"
        stack_source: file
        endpoint_id: "{{ item.endpoint_id | default(endpoint_id) }}"
        file: "{{ (item.template is defined) | ternary(rendered_dir ~ '/' ~ item.name ~ '.yml', item.file) }}"
        env: "{{ item.env | default([]) }}"
        prune: "{{ item.prune | default(true) }}"
        pull_images: "{{ item.pull_images | default(false) }}"
        timeout: 300
        state: present
      loop: "{{ stacks }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Clean up rendered compose files
      ansible.builtin.file:
        path: "{{ rendered_dir }}/{{ item.name }}.yml"
        state: absent
      loop: "{{ stacks | selectattr('template', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false
      run_once: true