# Input for the Prometheus snmp_exporter generator.
# Replace the placeholders locally with the SNMPv3 credentials configured on TrueNAS.
# Do not commit the generated snmp.yml; it contains these credentials.
auths:
  truenas_v3:
    version: 3
    username: "REPLACE_WITH_TRUENAS_SNMPV3_USER"
    security_level: authPriv
    password: "REPLACE_WITH_AUTH_PASSWORD"
    auth_protocol: SHA
    priv_protocol: AES
    priv_password: "REPLACE_WITH_PRIVACY_PASSWORD"

modules:
  truenas:
    walk:
      # SNMPv2-MIB::system: system description, name, and uptime.
      - 1.3.6.1.2.1.1
      # IF-MIB::ifTable: interface state and 32-bit counters.
      - 1.3.6.1.2.1.2.2
      # IF-MIB::ifXTable: high-capacity interface counters and names.
      - 1.3.6.1.2.1.31.1.1.1
      # HOST-RESOURCES-MIB system and storage tables.
      - 1.3.6.1.2.1.25.1
      - 1.3.6.1.2.1.25.2
      # HOST-RESOURCES-MIB device table, used to label processor indexes.
      - 1.3.6.1.2.1.25.3.2
      # HOST-RESOURCES-MIB processor table, including hrProcessorLoad.
      - 1.3.6.1.2.1.25.3.3
      # TRUENAS-MIB::zfs: zpools, zvols, ARC, L2ARC, and ZIL.
      - 1.3.6.1.4.1.50536.1
      - 1.3.6.1.4.1.2021
    max_repetitions: 25
    retries: 3
    timeout: 5s
    lookups:
      - source_indexes: [hrDeviceIndex]
        lookup: hrDeviceDescr
      - source_indexes: [zpoolIndex]
        lookup: zpoolName
      - source_indexes: [zvolIndex]
        lookup: zvolDescr
