---
- name: Mount the truenas nfs share for backups for immich
  ansible.posix.mount:
    src: "{{ immich_backup_nfs_share }}"
    path: "{{ immich_backup_mount_point }}"
    fstype: nfs
    opts: rw
    state: mounted

- name: Verify restic is insalled
  ansible.builtin.command:
    cmd: restic version
  register: restic_version
  changed_when: false

- name: Display restic version
  ansible.builtin.debug:
    msg: "Restic version: {{ restic_version.stdout }}"

- name: Create directory for password file if it does not exist
  ansible.builtin.file:
    path: "{{ immich_restic_password_file | dirname }}"
    state: directory
    mode: '0700'

- name: Create password file for restic immich repository
  ansible.builtin.copy:
    dest: "{{ immich_restic_password_file }}"
    content: "{{ immich_restic_password }}"
    mode: '0600'
  no_log: true

- name: Check whether the Restic repository is initialized
  ansible.builtin.stat:
    path: "{{ immich_restic_path }}/config"
  register: immich_restic_repository_config

- name: Initialize Restic repository for Immich backups
  ansible.builtin.command:
    cmd: restic init --repo {{ immich_restic_path }}
  environment:
    RESTIC_PASSWORD_FILE: "{{ immich_restic_password_file }}"
  when: not immich_restic_repository_config.stat.exists

- name: Create immich backup script
  ansible.builtin.template:
    src: container-manager/files/immich_backup/immich-backup.sh.j2
    dest: "{{ immich_backup_script_path }}"
    mode: '0700'
    owner: root
    group: root

- name: Ensure immich systemd service file template exists
  ansible.builtin.template:
    src: container-manager/files/immich_backup/immich-backup.service.j2
    dest: /etc/systemd/system/immich-backup.service
    mode: '0644'
    owner: root
    group: root

- name: Ensure immich timer file is placed in systemd directory
  ansible.builtin.copy:
    src: container-manager/files/immich_backup/immich-backup.timer
    dest: /etc/systemd/system/immich-backup.timer
    mode: '0644'
    owner: root
    group: root

- name: Reload systemd unit definitions
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start immich backup timer
  ansible.builtin.systemd:
    name: immich-backup.timer
    enabled: true
    state: started