---

vars: 
  immich_restic_path: "{{ immich_backup_mount_point }}/restic-repo"

environment:
  RESTIC_REPOSITORY: "{{ immich_restic_path }}"
  RESTIC_PASSWORD_FILE: "{{ immich_restic_password_file }}"

- name: Mount the truenas nfs share for backups for immich
  ansible.posix.mount:
    src: "{{ immich_backup_nfs_share }}"
    path: "{{ immich_backup_mount_point }}"
    fstype: nfs
    opts: rw
    state: mounted

- name: Verify restic is insalled
  ansible.builtin.command:
    cmd: restic version
  register: restic_version
  changed_when: false

- name: Display restic version
  ansible.builtin.debug:
    msg: "Restic version: {{ restic_version.stdout }}"

- name: Check if restic repository exists
  ansible.builtin.command:
    cmd: restic snapshots --repo {{ immich_restic_path }}
  register: restic_repo_check
  failed_when: false
  changed_when: false

- name: Setup restic repository for immich backups if it does not exist
  when: restic_repo_check.rc != 0
  ansible.builtin.block:
    - name: Create password file for restic immich repository
      ansible.builtin.copy:
        dest: "{{ immich_restic_password_file }}"
        content: "{{ immich_restic_password }}"
        mode: '0600'

    - name: Initialize restic repository if it does not exist
      ansible.builtin.command:
        cmd: restic init --repo {{ immich_restic_path }}

- name: Create immich backup script
  ansible.builtin.template:
    src: container-manager/files/immich_backup/immich-backup.sh.j2
    dest: "{{ immich_backup_script_path }}"
    mode: '0700'
    owner: root
    group: root

- name: Ensure immich systemd service file template exists
  ansible.builtin.template:
    src: container-manager/files/immich_backup/immich-backup.service.j2
    dest: /etc/systemd/system/immich-backup.service
    mode: '0644'
    owner: root
    group: root
  notify:
    - Restart systemd

- name: Ensure immich timer file is placed in systemd directory
  ansible.builtin.copy:
    src: container-manager/files/immich_backup/immich-backup.timer
    dest: /etc/systemd/system/immich-backup.timer
    mode: '0644'
    owner: root
    group: root
  notify:
    - Restart systemd

- name: Enable and start immich backup timer
  ansible.builtin.systemd:
    name: immich-backup.timer
    enabled: true
    state: started

- name: Ensure immich backup timeer is listed in systemd
  ansible.builtin.command:
    cmd: systemctl list-timers --all | grep immich-backup.timer
  register: immich_backup_timer_check
  changed_when: false

- name: Display immich backup timer status
  ansible.builtin.debug:
    msg: "Immich backup timer status: {{ immich_backup_timer_check.stdout }}"