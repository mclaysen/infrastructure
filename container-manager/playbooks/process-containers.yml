---
- name: Prepare containers for docker
  hosts: container_manager
  become: true
  handlers:
    - ansible.builtin.import_tasks: ../handlers/main.yml
  vars_files:
    - ../../group_vars/portainer_managers/vars.yml
    - ../../group_vars/portainer_managers/vault.yml
  tasks:
    - name: Create directory for container files
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/compose
        - /opt/compose/mclaysen_website
        - /opt/compose/cloudflared
        - /opt/compose/smarthome
        - /opt/compose/jellyfin
        - /opt/compose/jellystat
        - /opt/compose/newt

    - name: Create compose files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0644'
      loop:
        - {src: ../stacks/mclaysen_website.yml.j2, dest: /opt/compose/mclaysen_website/compose.yml }
        - {src: ../stacks/cloudflared.yml.j2, dest: /opt/compose/cloudflared/compose.yml }
        - {src: ../stacks/smarthome.yml.j2, dest: /opt/compose/smarthome/compose.yml }
        - {src: ../stacks/jellyfin.yml.j2, dest: /opt/compose/jellyfin/compose.yml }
        - {src: ../stacks/jellystat.yml.j2, dest: /opt/compose/jellystat/compose.yml }
        - {src: ../stacks/newt.yml.j2, dest: /opt/compose/newt/compose.yml }

    - name: Validate required secrets
      ansible.builtin.assert:
        that:
          - item.value is string
          - item.value | length > 0
          - '"\n" not in item.value'
          - '"\r" not in item.value'
        fail_msg: Jellystat secrets must be nonempty, single-line strings.
      loop:
        - value: "{{ jellystat_db_password }}"
        - value: "{{ jellystat_jwt_secret }}"
        - value: "{{ newt_id }}"
        - value: "{{ newt_secret }}"
      no_log: true

    - name: Create environment files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0600'
        owner: root
        group: root
      no_log: true
      loop:
        - {src: ../stacks/mclaysen_website.env.j2, dest: /opt/compose/mclaysen_website/.env }
        - {src: ../stacks/cloudflared.env.j2, dest: /opt/compose/cloudflared/.env }
        - {src: ../stacks/smarthome.env.j2, dest: /opt/compose/smarthome/.env }
        - {src: ../stacks/jellyfin.env.j2, dest: /opt/compose/jellyfin/.env }
        - {src: ../stacks/jellystat.env.j2, dest: /opt/compose/jellystat/.env }
        - {src: ../stacks/jellystat.db-pass.env.j2, dest: /opt/compose/jellystat/db-secrets.env }
        - {src: ../stacks/jellystat.jwt-token.env.j2, dest: /opt/compose/jellystat/jwt-token.env }
        - {src: ../stacks/newt.env.j2, dest: /opt/compose/newt/.env }
        - {src: ../stacks/newt.newt-id.env.j2, dest: /opt/compose/newt/id.env }
        - {src: ../stacks/newt.newt-secret.env.j2, dest: /opt/compose/newt/secret.env }

    - name: Create smarthome config directory
      ansible.builtin.file:
        path: "{{ homebridge_config_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy mclaysen_website container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/mclaysen_website
        remove_orphans: true
        project_name: mclaysen_website

    - name: Deploy cloudflared container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/cloudflared
        remove_orphans: true
        project_name: cloudflared

    - name: Deploy smarthome container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/smarthome
        remove_orphans: true
        project_name: smarthome

    - name: Create pangolin network
      community.docker.docker_network:
        name: pangolin_network
        state: present

    - name: Inspect Jellyfin media mounts
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --raw
          - --mountpoint
          - "{{ item.path }}"
          - --output
          - SOURCE,FSTYPE
      loop:
        - path: "{{ home_videos_mount_point }}"
          src: "{{ home_videos_nfs_share }}"
        - path: "{{ movies_mount_point }}"
          src: "{{ movies_nfs_share }}"
      register: jellyfin_mounts
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require the expected Jellyfin NFS mounts
      ansible.builtin.assert:
        that:
          - >-
            item.rc == 0 and
            (item.stdout | trim) in
            [item.item.src ~ ' nfs', item.item.src ~ ' nfs4']
        fail_msg: >-
          {{ item.item.path }} is not mounted from {{ item.item.src }} as NFS.
          Mount the share before deploying Jellyfin.
      loop: "{{ jellyfin_mounts.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Deploy jellyfin container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/jellyfin
        remove_orphans: true
        project_name: jellyfin

    - name: Deploy jellystat container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/jellystat
        remove_orphans: true
        project_name: jellystat

    - name: Deploy newt container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/newt
        remove_orphans: true
        project_name: newt