auths:
  syno_v3:
    version: 3
    security_level: authPriv
    username: "{{ snmp_synology_username }}"
    auth_protocol: MD5
    auth_password: "{{ snmp_synology_password }}"
    priv_protocol: AES
    priv_password: "{{ snmp_synology_privacy_password }}"
modules:
  synology:
    walk:
      - 1.3.6.1.2.1.2             # network statistics
      - 1.3.6.1.2.1.25.1          # host system statistics
      - 1.3.6.1.2.1.31.1.1        # The total number received/transmitted of the interface
      - 1.3.6.1.4.1.2021.4        # RAM statistics
      - 1.3.6.1.4.1.2021.10.1.2   # 1,5 and 15 minute names
      - 1.3.6.1.4.1.2021.10.1.5   # The 1,5 and 15 minute load averages
      - 1.3.6.1.4.1.2021.11       # CPU statistics
      - 1.3.6.1.4.1.2021.13.15.1  # HDD statistics
      - 1.3.6.1.4.1.6574.1        # displays all system statuses
      - 1.3.6.1.4.1.6574.2        # information regarding hard drives e.g Temperature
      - 1.3.6.1.4.1.6574.3        # monitoring RAID status
      - 1.3.6.1.4.1.6574.6        # Synology services and service user counts
    lookups:
      - source_indexes: [ifIndex]
        lookup: ifDescr
      - source_indexes: [diskIndex]
        lookup: diskModel
      - source_indexes: [raidIndex]
        lookup: raidName
      - source_indexes: [serviceInfoIndex]
        lookup: serviceName
        drop_source_indexes: true
      - source_indexes: [diskIndex]
        lookup: diskID

    overrides:
      SYNOLOGY-DISK-MIB::diskID:
        type: DisplayString
      SYNOLOGY-DISK-MIB::diskModel:
        type: DisplayString
      SYNOLOGY-DISK-MIB::diskType:
        type: DisplayString
      SYNOLOGY-DISK-MIB::diskName:
        type: DisplayString
      SYNOLOGY-DISK-MIB::diskRole:
        type: DisplayString
      SYNOLOGY-SERVICES-MIB::serviceName:
        type: DisplayString
      SYNOLOGY-SYSTEM-MIB::serialNumber:
        type: DisplayString
      SYNOLOGY-SYSTEM-MIB::modelName:
        type: DisplayString
      SYNOLOGY-RAID-MIB::raidName:
        type: DisplayString