# Input for the Prometheus snmp_exporter generator.
# Add authentication separately to the deployed SNMP exporter configuration.
# Generation requires the standard MIBs, UCD-SNMP-MIB, and UniFi MIBs.
modules:
  udm_pro:
    walk:
      # System information and interface counters.
      - 1.3.6.1.2.1.1
      - 1.3.6.1.2.1.2.2
      - 1.3.6.1.2.1.31.1.1.1
      # Host system, storage, device, and processor statistics.
      - 1.3.6.1.2.1.25.1
      - 1.3.6.1.2.1.25.2
      - 1.3.6.1.2.1.25.3.2
      - 1.3.6.1.2.1.25.3.3
      # Net-SNMP Linux statistics.
      - 1.3.6.1.4.1.2021
    lookups:
      - source_indexes: [ifIndex]
        lookup: ifName
      - source_indexes: [hrDeviceIndex]
        lookup: hrDeviceDescr
      - source_indexes: [hrStorageIndex]
        lookup: hrStorageDescr
      - source_indexes: [laIndex]
        lookup: laNames
        drop_source_indexes: true
    overrides:
      ifName: { ignore: true }
      hrDeviceDescr: { ignore: true }
      hrStorageDescr: { ignore: true }

  unifi_ap:
    walk:
      # System information and interface counters.
      - 1.3.6.1.2.1.1
      - 1.3.6.1.2.1.2.2
      - 1.3.6.1.2.1.31.1.1.1
      # UniFi AP interface, radio, VAP, and system metrics.
      - 1.3.6.1.4.1.41112.1.6
    lookups:
      - source_indexes: [ifIndex]
        lookup: ifName
      - source_indexes: [unifiIfIndex]
        lookup: unifiIfName
      - source_indexes: [unifiRadioIndex]
        lookup: unifiRadioName
      - source_indexes: [unifiVapIndex]
        lookup: unifiVapName
      - source_indexes: [unifiVapIndex]
        lookup: unifiVapEssId
    overrides:
      ifName: { ignore: true }
      unifiIfName: { ignore: true }
      unifiRadioName: { ignore: true }
      unifiVapName: { ignore: true }
      unifiVapEssId: { ignore: true }
