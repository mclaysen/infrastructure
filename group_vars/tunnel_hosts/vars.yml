---
# Non-secret configuration for tunnel_hosts
timezone: America/New_York
domain: mclaysen.com
email_address: me@mclaysen.com

pangolin_version: ee-1.25.3@sha256:f2c0fc54e1b59efcd23b8685e8df84350f363e14ebe1c13ce88a681f181ca49e
traefik_version: 3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
gerbil_version: 1.5.2@sha256:1f6e64eaba7997282c7067ba19922fc7e46b5f73e1a27add3dd66a591d50512f
badger_version: v1.7.0
loki_version: 3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
alloy_version: v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
crowdsec_plugin_version: v1.8.1
crowdsec_container_version: v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
max_mind_geoipupdate_version: v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
prometheus_version: v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
grafana_version: 13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f

deploy_user_name: deployUser
deployuser_ssh_public_key_path: ~/.ssh/rack_nerd_vps1.pub

sudoers_file_path: /etc/sudoers

security_ssh_config_path: /etc/ssh/sshd_config
security_sshd_name: sshd

security_ssh_port: 22
security_ssh_password_authentication: "no"
security_ssh_permit_root_login: "no"
security_ssh_usedns: "no"
security_ssh_permit_empty_password: "no"
security_ssh_challenge_response_auth: "no"
security_ssh_gss_api_authentication: "no"
security_ssh_x11_forwarding: "no"
security_sshd_state: started
security_ssh_restart_handler_state: restarted
security_ssh_allowed_users: 
  - "{{ deploy_user_name }}"
security_ssh_allowed_groups: []

security_sudoers_passwordless:
  - "{{ deploy_user_name }}"
security_sudoers_passworded: []

security_autoupdate_enabled: true
security_autoupdate_blacklist: []
security_autoupdate_additional_origins: []

firewall_ports:
  - 80/tcp
  - 443/tcp
  - 51820/udp
  - 21820/udp
  - "{{ security_ssh_port }}/tcp"

#monitoring configs
cadvisor_listen_ip: 172.17.0.1
cadvisor_port: 8080
cadvisor_version: 0.55.1
node_exporter_version: 1.10.2

docker_metrics_addr: 172.17.0.1:9323

#grafana configs
grafana_url: http://vps-dashboard.{{ domain }}
