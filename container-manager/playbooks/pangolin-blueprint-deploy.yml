---
- name: Deploy Pangolin blueprints
  hosts: container_manager
  become: true
  vars_files:
    - ../../group_vars/portainer_managers/vars.yml
    - ../../group_vars/portainer_managers/vault.yml
  handlers:
    - ansible.builtin.import_tasks: ../handlers/main.yml
  tasks:

    - name: Ensure rendered stacks directory exists
      ansible.builtin.file:
        path: "{{ blueprint_file_path | dirname }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0755'

    - name: Update the Pangolin blueprints
      ansible.builtin.template:
        src: ../stacks/home1_pangolin_blueprint.yml.j2
        dest: "{{ blueprint_file_path }}"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0644'
      notify: Restart newt