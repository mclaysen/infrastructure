---
- name: Prepare containers for docker
  hosts: container_manager
  become: true
  handlers:
    - ansible.builtin.import_tasks: ../handlers/main.yml
  vars_files:
    - ../../group_vars/portainer_managers/vars.yml
    - ../../group_vars/portainer_managers/vault.yml
  tasks:
    - name: Create directory for container files
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/compose
        - /opt/compose/mclaysen_website
        - /opt/compose/cloudflared
        - /opt/compose/smarthome
        - /opt/compose/jellyfin
        - /opt/compose/jellystat
        - /opt/compose/newt
        - /opt/compose/protonmail_bridge
        - /opt/compose/ghost
        - /opt/compose/monitoring

    - name: Create compose files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0644'
      loop:
        - {src: ../stacks/mclaysen_website.yml.j2, dest: /opt/compose/mclaysen_website/compose.yml }
        - {src: ../stacks/cloudflared.yml.j2, dest: /opt/compose/cloudflared/compose.yml }
        - {src: ../stacks/smarthome.yml.j2, dest: /opt/compose/smarthome/compose.yml }
        - {src: ../stacks/jellyfin.yml.j2, dest: /opt/compose/jellyfin/compose.yml }
        - {src: ../stacks/jellystat.yml.j2, dest: /opt/compose/jellystat/compose.yml }
        - {src: ../stacks/newt.yml.j2, dest: /opt/compose/newt/compose.yml }
        - {src: ../stacks/proton_mail_bridge.yml.j2, dest: /opt/compose/protonmail_bridge/compose.yml }
        - {src: ../stacks/ghost.yml.j2, dest: /opt/compose/ghost/compose.yml }
        - {src: ../stacks/monitoring.yml.j2, dest: /opt/compose/monitoring/compose.yml }

    - name: Validate required secrets
      ansible.builtin.assert:
        that:
          - item.value is string
          - item.value | length > 0
          - '"\n" not in item.value'
          - '"\r" not in item.value'
        fail_msg: Stack secrets must be nonempty, single-line strings.
      loop:
        - value: "{{ jellystat_db_password }}"
        - value: "{{ jellystat_jwt_secret }}"
        - value: "{{ newt_id }}"
        - value: "{{ newt_secret }}"
        - value: "{{ PROTONMAIL_KEYRING_PASSPHRASE }}"
        - value: "{{ ghost_database_password }}"
        - value: "{{ ghost_database_root_password }}"
        - value: "{{ email_password }}"
        - value: "{{ unifi_unpoller_password }}"
      no_log: true

    - name: Create environment files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0600'
        owner: root
        group: root
      no_log: true
      loop:
        - {src: ../stacks/mclaysen_website.env.j2, dest: /opt/compose/mclaysen_website/.env }
        - {src: ../stacks/cloudflared.env.j2, dest: /opt/compose/cloudflared/.env }
        - {src: ../stacks/smarthome.env.j2, dest: /opt/compose/smarthome/.env }
        - {src: ../stacks/jellyfin.env.j2, dest: /opt/compose/jellyfin/.env }
        - {src: ../stacks/jellystat.env.j2, dest: /opt/compose/jellystat/.env }
        - {src: ../stacks/jellystat.db-pass.env.j2, dest: /opt/compose/jellystat/db-secrets.env }
        - {src: ../stacks/jellystat.jwt-token.env.j2, dest: /opt/compose/jellystat/jwt-token.env }
        - {src: ../stacks/newt.env.j2, dest: /opt/compose/newt/.env }
        - {src: ../stacks/newt.newt-id.env.j2, dest: /opt/compose/newt/id.env }
        - {src: ../stacks/newt.newt-secret.env.j2, dest: /opt/compose/newt/secret.env }
        - {src: ../stacks/protonmail_bridge.env.j2, dest: /opt/compose/protonmail_bridge/.env }
        - {src: ../stacks/protonmail_bridge.secret.env.j2, dest: /opt/compose/protonmail_bridge/secret.env }
        - {src: ../stacks/ghost.env.j2, dest: /opt/compose/ghost/.env }
        - {src: ../stacks/ghost.ghost-db-pass.env.j2, dest: /opt/compose/ghost/ghost-db-pass.env }
        - {src: ../stacks/ghost.db-pass.env.j2, dest: /opt/compose/ghost/db-pass.env }
        - {src: ../stacks/ghost.db-root-pass.env.j2, dest: /opt/compose/ghost/db-root-pass.env }
        - {src: ../stacks/ghost.email-pass.env.j2, dest: /opt/compose/ghost/email-pass.env }
        - {src: ../stacks/monitoring_stack.env.j2, dest: /opt/compose/monitoring/.env }
        - {src: ../stacks/monitoring_stack.unfi-pass.env.j2, dest: /opt/compose/monitoring/unfi-pass.env }

    - name: Create smarthome config directory
      ansible.builtin.file:
        path: "{{ homebridge_config_dir }}"
        state: directory
        mode: '0755'

    - name: Deploy mclaysen_website container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/mclaysen_website
        remove_orphans: true
        project_name: mclaysen_website

    - name: Deploy cloudflared container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/cloudflared
        remove_orphans: true
        project_name: cloudflared

    - name: Deploy smarthome container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/smarthome
        remove_orphans: true
        project_name: smarthome

    - name: Create pangolin network
      community.docker.docker_network:
        name: pangolin_network
        state: present

    - name: Create monitoring network
      community.docker.docker_network:
        name: monitoring_network
        state: present

    - name: Create protonmail network
      community.docker.docker_network:
        name: protonmail-network
        state: present

    - name: Create ghost network
      community.docker.docker_network:
        name: ghost_network
        state: present

    - name: Inspect Jellyfin media mounts
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --raw
          - --mountpoint
          - "{{ item.path }}"
          - --output
          - SOURCE,FSTYPE
      loop:
        - path: "{{ home_videos_mount_point }}"
          src: "{{ home_videos_nfs_share }}"
        - path: "{{ movies_mount_point }}"
          src: "{{ movies_nfs_share }}"
      register: jellyfin_mounts
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require the expected Jellyfin NFS mounts
      ansible.builtin.assert:
        that:
          - >-
            item.rc == 0 and
            (item.stdout | trim) in
            [item.item.src ~ ' nfs', item.item.src ~ ' nfs4']
        fail_msg: >-
          {{ item.item.path }} is not mounted from {{ item.item.src }} as NFS.
          Mount the share before deploying Jellyfin.
      loop: "{{ jellyfin_mounts.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Deploy jellyfin container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/jellyfin
        remove_orphans: true
        project_name: jellyfin

    - name: Deploy jellystat container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/jellystat
        remove_orphans: true
        project_name: jellystat

    - name: Deploy newt container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/newt
        remove_orphans: true
        project_name: newt

    - name: Deploy Proton Mail Bridge container
      community.docker.docker_compose_v2:
        project_src: /opt/compose/protonmail_bridge
        remove_orphans: true
        project_name: protonmail_bridge

    - name: Inspect existing Ghost data directories
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: true
      loop:
        - "{{ ghost_upload_path }}"
        - "{{ ghost_mysql_data_path }}"
        - "{{ ghost_mysql_data_path }}/mysql"
      register: ghost_data_directories

    - name: Require existing Ghost content and initialized MySQL data
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir | default(false)
        fail_msg: >-
          {{ item.item }} is missing or is not a directory. Verify the
          existing Ghost mounts before deploying.
      loop: "{{ ghost_data_directories.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Deploy Ghost containers
      community.docker.docker_compose_v2:
        project_src: /opt/compose/ghost
        remove_orphans: true
        project_name: ghost

    - name: Create monitoring config directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        recurse: true
      loop:
        - "{{ snmp_exporter_config_path | ansible.builtin.dirname }}"
        - "{{ prometheus_config_path | ansible.builtin.dirname }}"

    - name: Create monitoring config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ username }}"
        group: "{{ username }}"
      loop:
        - "{{ alloy_config_dir }}"
        - "{{ loki_config_path | ansible.builtin.dirname }}"
        - "{{ blackbox_exporter_config_path | ansible.builtin.dirname }}"

    - name: Place Prometheus configuration
      ansible.builtin.template:
        src: ../stacks/prometheus_config.yml.j2
        dest: "{{ prometheus_config_path }}"
        mode: '0644'

    - name: Place SNMP Exporter configuration
      ansible.builtin.template:
        src: ../stacks/snmp_config.yml.j2
        dest: "{{ snmp_exporter_config_path }}"
        mode: '0644'

    - name: Place Alloy configuration
      ansible.builtin.template:
        src: ../templates/alloy_config.alloy.j2
        dest: "{{ alloy_config_dir }}/config.alloy"
        mode: '0644'
        owner: "{{ username }}"
        group: "{{ username }}"

    - name: Place Loki configuration
      ansible.builtin.template:
        src: ../templates/loki_config.yml.j2
        dest: "{{ loki_config_path }}"
        mode: '0644'
        owner: "{{ username }}"
        group: "{{ username }}"

    - name: Place Blackbox Exporter configuration
      ansible.builtin.template:
        src: ../templates/blackbox_config.yml.j2
        dest: "{{ blackbox_exporter_config_path }}"
        mode: '0644'
        owner: "{{ username }}"
        group: "{{ username }}"

    - name: Deploy docker config
      ansible.builtin.template:
        src: ../../shared/templates/docker_daemon.json.j2
        dest: /etc/docker/daemon.json
      notify: restart docker

    - name: Deploy monitoring apps
      ansible.builtin.import_tasks: ../tasks/apps.yml

    - name: Deploy Monitoring containers
      community.docker.docker_compose_v2:
        project_src: /opt/compose/monitoring
        remove_orphans: true
        project_name: monitoring