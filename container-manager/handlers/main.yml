---
- name: restart docker
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Restart newt
  community.docker.docker_container:
    name: newt
    state: started
    restart: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Grafana container
  community.docker.docker_container:
    name: grafana
    state: started
    restart: true

- name: Recreate Prometheus
  community.docker.docker_compose_v2:
    project_src: /opt/compose/monitoring
    project_name: monitoring
    services: [prometheus]
    dependencies: false
    recreate: always

- name: Recreate SNMP exporter
  community.docker.docker_compose_v2:
    project_src: /opt/compose/monitoring
    project_name: monitoring
    services: [snmp_exporter]
    dependencies: false
    recreate: always